name: Vercel Port Verify

on:
  push:
    branches:
      - deploy/vercel-port
  pull_request:
    branches:
      - sites/run-001-saas-bfux

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run portable core tests
        run: npm run test:core

      - name: Build native Next.js application
        run: npm run build
